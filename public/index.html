<!DOCTYPE html>





<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elektrik Direk Haritası - OSM</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Draw CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />

    <!-- App CSS -->
    <link rel="stylesheet" href="/css/style.css?v=1771893487878">
</head>

<body>
    <!-- Hamburger menu (mobil) -->
    <button class="hamburger-btn" data-action="toggleSidebar" aria-label="Menü">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay" data-action="closeSidebar"></div>

    <div id="container" class="autocad-layout">
        <!-- AutoCAD Header (Top Bar + Ribbon) -->
        <div class="autocad-header">
            <!-- Üst Bar — Dropdown Grupları -->
        <div class="top-bar">
            <div class="project-selector">
                <label>Proje:</label>
                <select id="projeSelect" data-action="projeDegistir" style="min-width: 140px;">
                    <option value="">Proje seçin...</option>
                </select>

                <input type="text" id="direkAraInput" placeholder="🔍 Direk ara...">
                <button class="topbar-btn" data-action="direkAraBtn">Ara</button>
                <button class="topbar-btn" data-action="yeniProjeModal" style="color: var(--accent);">＋ Yeni
                    Proje</button>

                <!-- Raporlar Dropdown -->
                <div class="dropdown-group">
                    <button class="dropdown-trigger">📊 Raporlar ▾</button>
                    <div class="dropdown-menu">
                        <button class="dropdown-item" data-action="metrajHesapla">📐 Metraj Raporu</button>
                        <button class="dropdown-item" data-action="malzemeRaporu">📋 Malzeme Raporu</button>
                        <button class="dropdown-item" data-action="maliyetRaporu">💰 Maliyet Raporu</button>
                        <div class="dropdown-sep"></div>
                        <button class="dropdown-item" data-action="pdfRaporOlustur">📄 PDF Rapor</button>
                        <button class="dropdown-item" data-action="islemGecmisiGoster">📋 İşlem Geçmişi</button>
                    </div>
                </div>

                <!-- Import/Export Dropdown -->
                <div class="dropdown-group">
                    <button class="dropdown-trigger">📥 Veri ▾</button>
                    <div class="dropdown-menu">
                        <button class="dropdown-item" data-action="topluImportModal">📥 Excel Import</button>
                        <button class="dropdown-item" data-action="excelImportModal">📊 CSV Şablon Import</button>
                        <button class="dropdown-item" data-action="dxfImportModal">📐 DXF Import</button>
                        <div class="dropdown-sep"></div>
                        <button class="dropdown-item" data-action="exportExcel">📊 Excel Export</button>
                        <button class="dropdown-item" data-action="exportKML">🌍 KML Export</button>
                        <button class="dropdown-item" data-action="dxfExport">📐 DXF Export</button>
                    </div>
                </div>
            </div>

            <div class="user-menu">
                <button class="theme-toggle" data-action="toggleTheme" title="Tema Değiştir">🌙</button>
                <span id="userName" style="font-weight: 600;"></span>
                <a href="#" data-action="cikis"
                    style="color: var(--danger); text-decoration: none; font-weight: 500; font-size: 12px;">Çıkış</a>
                <span id="adminLink" style="display: none;"> <a href="/admin"
                        style="color: var(--accent); text-decoration: none; font-size: 12px;">Admin</a></span>
            </div>
        </div>

        <!-- YENİ ÜST ARAÇ ÇUBUĞU (TOP RIBBON) -->
        <div class="top-ribbon" id="topRibbon">
            <!-- Temel Araçlar Grubu -->
            <div class="ribbon-group">
                <button class="ribbon-btn active" data-action="setTool" data-tool="select" title="Seçim Aracı">
                    <span class="ribbon-icon">🔍</span>
                    <span class="ribbon-text">Seç</span>
                </button>
                <button class="ribbon-btn" data-action="setTool" data-tool="add" title="Direk Ekle">
                    <span class="ribbon-icon">📍</span>
                    <span class="ribbon-text">Ekle</span>
                </button>
                <button class="ribbon-btn" data-action="setTool" data-tool="measure" title="Mesafe Ölç (M)">
                    <span class="ribbon-icon">📏</span>
                    <span class="ribbon-text">Mesafe</span>
                </button>
            </div>

            <div class="ribbon-divider"></div>

            <!-- Çizim Grubu -->
            <div class="ribbon-group">
                <button class="ribbon-btn" data-action="hatCizimModuBaslat" title="Hat Çiz">
                    <span class="ribbon-icon">🔌</span>
                    <span class="ribbon-text">Hat</span>
                </button>
                <button class="ribbon-btn" data-action="zincirlemeHatModuBaslat" title="Zincirleme Hat">
                    <span class="ribbon-icon">⛓️</span>
                    <span class="ribbon-text">Zincir</span>
                </button>
                <button class="ribbon-btn" data-action="otomatikHatOlustur" title="Otomatik Hat">
                    <span class="ribbon-icon">🕸️</span>
                    <span class="ribbon-text">Oto Hat</span>
                </button>
            </div>

            <div class="ribbon-divider"></div>

            <!-- Görünüm & Analiz Grubu -->
            <div class="ribbon-group">
                <button class="ribbon-btn" data-action="toggleCADMode" title="CAD Modu">
                    <span class="ribbon-icon">📐</span>
                    <span class="ribbon-text">CAD</span>
                </button>
                <button class="ribbon-btn" data-action="toggleLayerPanel" title="Katmanlar">
                    <span class="ribbon-icon">🗂️</span>
                    <span class="ribbon-text">Katman</span>
                </button>
                <button class="ribbon-btn" data-action="toggleFilterPanel" title="Filtrele">
                    <span class="ribbon-icon">🔽</span>
                    <span class="ribbon-text">Filtre</span>
                </button>
            </div>

            <div class="ribbon-divider"></div>

            <!-- Seçim & Özel Operasyonlar Grubu -->
            <div class="ribbon-group">
                <button class="ribbon-btn" data-action="startPolygonSelect" title="Bölge Seçimi">
                    <span class="ribbon-icon">⬡</span>
                    <span class="ribbon-text">Bölge</span>
                </button>
                <button class="ribbon-btn" data-action="trafoBolgesiTanimla" title="Trafo Bölgesi">
                    <span class="ribbon-icon">⚡</span>
                    <span class="ribbon-text">Trafo</span>
                </button>
                <button class="ribbon-btn" data-action="hatAnaliziYap" title="Topoloji Analizi">
                    <span class="ribbon-icon">🔬</span>
                    <span class="ribbon-text">Analiz</span>
                </button>
                <button class="ribbon-btn" data-action="koordinatDonusum" title="Koordinat Dönüşüm">
                    <span class="ribbon-icon">🌐</span>
                    <span class="ribbon-text">Koord.</span>
                </button>
            </div>

            <div class="ribbon-divider"></div>

            <!-- Navigasyon & Araçlar Grubu -->
            <div class="ribbon-group">
                <button class="ribbon-btn" data-action="konumumuGoster" title="Konumumu Göster">
                    <span class="ribbon-icon">📱</span>
                    <span class="ribbon-text">Konum</span>
                </button>
                <button class="ribbon-btn" data-action="yolTarifiAl" title="Yol Tarifi Al">
                    <span class="ribbon-icon">🚗</span>
                    <span class="ribbon-text">Yol</span>
                </button>
                <button class="ribbon-btn" data-action="gpxImportModal" title="GPX Import">
                    <span class="ribbon-icon">📤</span>
                    <span class="ribbon-text">İçe Aktar</span>
                </button>
                <button class="ribbon-btn" data-action="toggleLiveSync" title="Canlı Senkron">
                    <span class="ribbon-icon">📡</span>
                    <span class="ribbon-text">Canlı</span>
                </button>
            </div>

            <div class="ribbon-divider"></div>

            <!-- Sistem Grubu -->
            <div class="ribbon-group">
                <button class="ribbon-btn" data-action="toggleRecentPanel" title="Son İşlemler">
                    <span class="ribbon-icon">📝</span>
                    <span class="ribbon-text">Geçmiş</span>
                </button>
                <button class="ribbon-btn" data-action="temizleCizimler" title="Çizimleri Temizle">
                    <span class="ribbon-icon">🧹</span>
                    <span class="ribbon-text">Temizle</span>
                </button>
                <button class="ribbon-btn" data-action="startOnboarding" title="Yardım / Tur">
                    <span class="ribbon-icon">❓</span>
                    <span class="ribbon-text">Yardım</span>
                </button>
            </div>
        </div>
            <button id="toggleHeaderBtn" class="toggle-header-btn" title="Menüyü Gizle/Göster">▲</button>
        </div>
<div class="autocad-workspace">
        <div id="sidebar" class="properties-panel">
            <div class="sidebar-header drag-handle" id="sidebarHeader">
                <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <button id="togglePanelBtn" class="toggle-panel-btn" title="Paneli Gizle/Göster">◀</button>
        <h2>
                        <span>⚡</span>
                        <span>Özellikler</span>
                    </h2>
                    <button class="sidebar-close-btn" data-action="closeSidebar" style="display: none;">&times;</button>
                </div>
                <p style="font-size: 11px; color: #94a3b8; margin-top: 4px;" id="currentProjectName">Proje seçilmedi</p>
            </div>

            <div class="sidebar-content">
                <!-- Direk Ekleme Formu -->
                <div class="sidebar-section">
                    <h3 class="accordion-header" data-action="toggleAccordion"><span>Yeni Direk Ekle</span> <span
                            class="chevron">▼</span></h3>
                    <div class="accordion-content">
                        <div class="property-row">
                            <label>Numara</label>
                            <input type="text" id="direkNumara" placeholder="(otomatik)">
                        </div>
                        <div class="property-row">
                            <label>Cins</label>
                            <select id="direkCinsi"></select>
                        </div>
                        <div class="property-row">
                            <label>Tip</label>
                            <select id="direkTipi"></select>
                        </div>
                        <div class="property-row">
                            <label>Durum</label>
                            <select id="direkDurum">
                                <option value="MEVCUT">MEVCUT</option>
                                <option value="YENİ">YENİ</option>
                                <option value="DEMONTAJ">DEMONTAJ</option>
                            </select>
                        </div>
                        <div class="property-row">
                            <label>Enlem</label>
                            <input type="number" id="direkLat" step="any">
                        </div>
                        <div class="property-row">
                            <label>Boylam</label>
                            <input type="number" id="direkLng" step="any">
                        </div>
                        <div class="property-actions mt-2">
                            <button class="btn btn-success btn-sm w-100" data-action="direkEkle">➕ Ekle</button>
                            <button class="btn btn-primary btn-sm w-100" data-action="haritadanSec">📍 Haritadan
                                Seç</button>
                        </div>
                    </div>
                </div>

                <!-- Seçili Direk Detayları -->
                <div class="sidebar-section" id="direkDetaySection" style="display: none;">
                    <h3 class="accordion-header" data-action="toggleAccordion"><span>Genel</span> <span
                            class="chevron">▼</span></h3>
                    <div class="accordion-content">
                        <div class="property-row">
                            <label>Numara</label>
                            <input type="text" id="editNumara">
                        </div>
                        <div class="property-row">
                            <label>Cins</label>
                            <select id="editCins"></select>
                        </div>
                        <div class="property-row">
                            <label>Tip</label>
                            <select id="editTip"></select>
                        </div>
                        <div class="property-row">
                            <label>Durum</label>
                            <select id="editDurum">
                                <option value="MEVCUT">MEVCUT</option>
                                <option value="YENİ">YENİ</option>
                                <option value="DEMONTAJ">DEMONTAJ</option>
                            </select>
                        </div>
                    </div>

                    <h3 class="accordion-header" data-action="toggleAccordion"><span>Geometri</span> <span
                            class="chevron">▼</span></h3>
                    <div class="accordion-content">
                        <div class="property-row">
                            <label>Enlem</label>
                            <input type="number" id="editLat" step="any">
                        </div>
                        <div class="property-row">
                            <label>Boylam</label>
                            <input type="number" id="editLng" step="any">
                        </div>
                        <div class="property-full-row mt-2">
                            <button class="btn btn-primary btn-sm w-100" data-action="direkGuncelle">💾
                                Güncelle</button>
                        </div>
                    </div>

                    <h3 class="accordion-header collapsed" data-action="toggleAccordion"><span>Ek Bilgiler</span> <span
                            class="chevron">▼</span></h3>
                    <div class="accordion-content" style="display: none;">
                        <div class="property-full-row">
                            <textarea id="editAciklama" rows="2" placeholder="Not..."></textarea>
                            <button class="btn btn-primary btn-sm mt-1 w-100" data-action="aciklamaKaydet">💾 Notu
                                Kaydet</button>
                        </div>
                        <div class="property-full-row mt-2">
                            <label
                                style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 4px;">Fotoğraf</label>
                            <input type="file" id="direkFotoInput" accept="image/*" data-action="fotoYukle"
                                class="file-input-sm">
                            <div id="fotoOnizleme" style="margin-top: 5px; max-width: 100%;"></div>
                        </div>
                        <div class="property-full-row mt-2 border-top pt-2">
                            <button class="btn btn-danger btn-sm w-100" data-action="direkSil">🗑️ Direği Sil</button>
                        </div>
                    </div>

                    <h3 class="accordion-header" data-action="toggleAccordion"><span>Malzemeler</span> <span
                            class="chevron">▼</span></h3>
                    <div class="accordion-content">
                        <button class="btn btn-success btn-sm w-100 mb-2" data-action="malzemeEklePenceresiAc">📦
                            Malzeme Ekle</button>
                        <div class="malzeme-list" id="malzemeList"></div>
                    </div>
                </div>

                <!-- Direk Listesi -->
                <div class="sidebar-section">
                    <h3 class="accordion-header collapsed" data-action="toggleAccordion"><span>Proje
                            İstatistikleri</span> <span class="chevron">▼</span></h3>
                    <div class="accordion-content" style="display: none;">
                        <div class="stats mb-2" style="grid-template-columns: 1fr 1fr; gap: 8px;">
                            <div class="stat-box mini" style="padding: 8px;">
                                <div class="stat-value" id="toplamDirek" style="font-size: 16px;">0</div>
                                <div class="stat-label" style="font-size: 10px;">Direk</div>
                            </div>
                            <div class="stat-box mini" style="padding: 8px;">
                                <div class="stat-value" id="toplamMesafe" style="font-size: 16px;">0</div>
                                <div class="stat-label" style="font-size: 10px;">Hat (km)</div>
                            </div>
                        </div>
                        <div class="direk-list" id="direkList" style="max-height: 200px;"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="map"></div>
        </div> <!-- /autocad-workspace -->


        <!-- Mesafe Sonucu -->
        <div id="measureResult" class="measure-result" style="display: none;">
            📏 Mesafe: <span id="measureDistance">0</span> m
            <button data-action="kapatMeasure"
                style="margin-left: 15px; background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px;">Kapat</button>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-bar-left">
                <div class="status-item">
                    <span class="status-dot"></span>
                    <span>Bağlı</span>
                </div>
                <div class="status-item" id="statusCoord">
                    📍 39.9200, 32.8540
                </div>
                <div class="status-item" id="statusZoom">
                    🔍 Zoom: 15
                </div>
            </div>
            <div class="status-bar-right">
                <div class="status-item" id="statusDirekCount">
                    📌 0 direk
                </div>
                <div class="status-item" id="statusHatCount">
                    🔗 0 hat
                </div>
            </div>
        </div>
    </div>

    <!-- Yeni Proje Modal -->
    <div id="projeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Yeni Proje Oluştur</h2>
                <button class="close-btn" data-action="kapatModal">&times;</button>
            </div>
            <div class="form-group">
                <label>Proje Adı</label>
                <input type="text" id="yeniProjeAd" placeholder="Proje adı girin">
            </div>
            <div class="form-group">
                <label>Açıklama</label>
                <input type="text" id="yeniProjeAciklama" placeholder="Açıklama (opsiyonel)">
            </div>
            <button class="btn btn-success" data-action="projeOlustur">Oluştur</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="/js/app.js?v=1771893487878"></script>
</body>

</html>
