<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elektrik Direk Haritası - Giriş</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        .toggle-form {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .toggle-form a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
        }

        .error {
            color: #e74c3c;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .success {
            color: #27ae60;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h1>⚡ Elektrik Direk Haritası</h1>
        <p class="subtitle">Koordinatlı Direk Yönetim Sistemi</p>

        <div id="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Kullanıcı Adı veya Email</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Giriş Yap</button>
        </form>

        <form id="registerForm" style="display: none;">
            <div class="form-group">
                <label>Kullanıcı Adı</label>
                <input type="text" id="regUsername" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" required>
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" id="regPassword" required minlength="6">
            </div>
            <button type="submit">Kayıt Ol</button>
        </form>

        <div class="toggle-form">
            <span id="toggleText">Hesabınız yok mu? <a onclick="toggleForm()">Kayıt olun</a></span>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        let isLogin = true;

        function toggleForm() {
            isLogin = !isLogin;
            document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
            document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
            document.getElementById('toggleText').innerHTML = isLogin
                ? 'Hesabınız yok mu? <a onclick="toggleForm()">Kayıt olun</a>'
                : 'Zaten hesabınız var mı? <a onclick="toggleForm()">Giriş yapın</a>';
            document.getElementById('message').innerHTML = '';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/harita';
                } else {
                    document.getElementById('message').innerHTML = `<div class="error">${data.error}</div>`;
                }
            } catch (err) {
                document.getElementById('message').innerHTML = `<div class="error">Bağlantı hatası</div>`;
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            try {
                const res = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    document.getElementById('message').innerHTML = `<div class="success">Kayıt başarılı! Yönlendiriliyorsunuz...</div>`;
                    setTimeout(() => window.location.href = '/harita', 1500);
                } else {
                    document.getElementById('message').innerHTML = `<div class="error">${data.error}</div>`;
                }
            } catch (err) {
                document.getElementById('message').innerHTML = `<div class="error">Bağlantı hatası</div>`;
            }
        });

        // Eğer zaten giriş yapılmışsa yönlendir
        if (localStorage.getItem('token')) {
            window.location.href = '/harita';
        }
    </script>
</body>

</html>
